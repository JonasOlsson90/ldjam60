<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LD Jam 60</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Scale the canvas to fill the page while keeping its 4:3 aspect
       ratio (like Phaser.Scale.FIT in ldjam59). Phaser's scale manager
       pins #game to the game size with inline styles, so the overrides
       need !important. */
    #game {
      width: auto !important;
      height: auto !important;
      transform: none !important;
    }
    #game canvas {
      width: min(100vw, calc(100vh * 4 / 3)) !important;
      height: auto !important;
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="phaser.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
