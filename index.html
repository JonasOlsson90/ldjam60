<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LD Jam 60</title>
  <!-- Scaling and centering are done by Phaser's scale manager
       (Phaser.Scale.FIT + CENTER_BOTH, like in ldjam59). Custom CSS
       overrides fight the scale manager's inline styles and break
       fullscreen centering, so the styles stay minimal. -->
  <style>
    body {
      margin: 0;
      background: black;
      user-select: none;
    }
    /* Keep the pixel art crisp when the scale manager stretches the
       canvas with CSS (this only affects rendering, not layout). */
    #game canvas {
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="phaser.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
